<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agent Crown Race app icon">
<title>Agent Crown Race</title>

<defs>
  <linearGradient id="goldBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbe7a1"/>
    <stop offset=".3" stop-color="#f7dc8f"/>
    <stop offset=".58" stop-color="#d4af37"/>
    <stop offset=".82" stop-color="#b3871f"/>
    <stop offset="1" stop-color="#8a6a1f"/>
  </linearGradient>
  <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f9e29a"/>
    <stop offset=".35" stop-color="#e9c860"/>
    <stop offset=".65" stop-color="#d4af37"/>
    <stop offset="1" stop-color="#8a6a1f"/>
  </linearGradient>
  <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7dc8f"/>
    <stop offset=".45" stop-color="#d4af37"/>
    <stop offset=".75" stop-color="#8a6a1f"/>
    <stop offset="1" stop-color="#f7dc8f"/>
  </linearGradient>
  <radialGradient id="orbGrad" cx=".38" cy=".3" r=".9">
    <stop offset="0" stop-color="#fff6cf"/>
    <stop offset=".35" stop-color="#f7dc8f"/>
    <stop offset=".7" stop-color="#cf9c2e"/>
    <stop offset="1" stop-color="#8a6a1f"/>
  </radialGradient>
  <radialGradient id="rubyGrad" cx=".4" cy=".3" r=".95">
    <stop offset="0" stop-color="#ff9d8a"/>
    <stop offset=".35" stop-color="#e8354f"/>
    <stop offset=".68" stop-color="#a8122a"/>
    <stop offset="1" stop-color="#5f0815"/>
  </radialGradient>
  <linearGradient id="sheenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#463004" stop-opacity="0"/>
    <stop offset="1" stop-color="#463004" stop-opacity=".38"/>
  </linearGradient>
  <radialGradient id="tileGrad" cx=".5" cy=".36" r=".95">
    <stop offset="0" stop-color="#232329"/>
    <stop offset=".55" stop-color="#141419"/>
    <stop offset="1" stop-color="#0a0a0e"/>
  </radialGradient>
  <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="bodyClip">
    <path d="M92 332 C86 280 84 222 110 152 L183 240 L256 110 L329 240 L402 152 C428 222 426 280 420 332 Z"/>
  </clipPath>
</defs>

<rect x="0" y="0" width="512" height="512" rx="110" fill="url(#tileGrad)"/>
<ellipse cx="256" cy="86" rx="290" ry="104" fill="#ffffff" opacity=".028"/>
<circle cx="256" cy="248" r="150" fill="#d4af37" opacity=".15" filter="url(#blur24)"/>
<g transform="translate(256 254) scale(0.96) translate(-256 -226)">

<g id="crown">
  <!-- ground shadow -->
  <ellipse cx="256" cy="406" rx="152" ry="15" fill="#000000" opacity=".30" filter="url(#blur6)"/>
  <!-- body -->
  <path d="M92 332 C86 280 84 222 110 152 L183 240 L256 110 L329 240 L402 152 C428 222 426 280 420 332 Z" fill="url(#goldBody)" stroke="#8a6a1f" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#bodyClip)">
    <polygon points="60,340 110,140 183,240 196,340" fill="#7a5a12" opacity=".26"/>
    <polygon points="452,340 402,140 329,240 316,340" fill="#7a5a12" opacity=".26"/>
    <polygon points="183,240 256,110 329,240 302,340 210,340" fill="#fff3bc" opacity=".30"/>
    <rect x="60" y="96" width="392" height="150" fill="url(#sheenGrad)"/>
    <rect x="60" y="238" width="392" height="102" fill="url(#shadeGrad)"/>
  </g>
  <!-- facet engraving -->
  <g stroke="#8a6a1f" stroke-width="3" opacity=".45" fill="none">
    <path d="M110 152 L183 240 L256 110 L329 240 L402 152"/>
    <path d="M183 240 L190 330 M329 240 L322 330" opacity=".6"/>
  </g>
  <path d="M92 332 C86 280 84 222 110 152 L183 240 L256 110 L329 240 L402 152 C428 222 426 280 420 332 Z" fill="none" stroke="#5f470e" stroke-width="2" stroke-linejoin="round" opacity=".55"/>
  <!-- orb necks -->
  <path d="M100 152 L120 152 L115 126 L105 126 Z" fill="url(#goldBody)" stroke="#8a6a1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M244 112 L268 112 L262 84 L250 84 Z" fill="url(#goldBody)" stroke="#8a6a1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M392 152 L412 152 L407 126 L397 126 Z" fill="url(#goldBody)" stroke="#8a6a1f" stroke-width="3" stroke-linejoin="round"/>
  <!-- orb finials -->
  <g stroke="#8a6a1f" stroke-width="3">
    <circle cx="110" cy="120" r="18" fill="url(#orbGrad)"/>
    <circle cx="256" cy="76" r="22" fill="url(#orbGrad)"/>
    <circle cx="402" cy="120" r="18" fill="url(#orbGrad)"/>
  </g>
  <g fill="#ffffff">
    <ellipse cx="103" cy="112" rx="5.5" ry="3.6" opacity=".9" transform="rotate(-25 103 112)"/>
    <ellipse cx="248" cy="67" rx="7" ry="4.4" opacity=".9" transform="rotate(-25 248 67)"/>
    <ellipse cx="395" cy="112" rx="5.5" ry="3.6" opacity=".9" transform="rotate(-25 395 112)"/>
  </g>
  <!-- band -->
  <rect x="92" y="330" width="328" height="64" rx="12" fill="url(#goldBand)" stroke="#8a6a1f" stroke-width="5"/>
  <rect x="101" y="338" width="310" height="48" rx="8" fill="none" stroke="#ffeeb0" stroke-width="2" opacity=".30"/>
  <rect x="106" y="337" width="300" height="5" rx="2.5" fill="#ffffff" opacity=".26"/>
  <!-- engraved studs -->
  <g fill="#7a5a12" opacity=".7">
    <path d="M128 355 L135 362 L128 369 L121 362 Z"/>
    <path d="M208 355 L215 362 L208 369 L201 362 Z"/>
    <path d="M304 355 L311 362 L304 369 L297 362 Z"/>
    <path d="M384 355 L391 362 L384 369 L377 362 Z"/>
  </g>
  <!-- gem bezels -->
  <g fill="url(#goldBand)" stroke="#6e5416" stroke-width="2" stroke-linejoin="round">
    <polygon points="256,335 283,350 274,383 256,392 238,383 229,350"/>
    <polygon points="168,340 189,362 168,384 147,362"/>
    <polygon points="344,340 365,362 344,384 323,362"/>
  </g>
  <!-- center ruby -->
  <polygon points="256,338 280,352 272,380 256,390 240,380 232,352" fill="url(#rubyGrad)" stroke="#57060f" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#ffb3a7" stroke-width="2" opacity=".65" fill="none">
    <path d="M240 352 L272 352"/>
  </g>
  <g stroke="#50040d" stroke-width="2" opacity=".45" fill="none">
    <path d="M232 352 L256 365 L280 352 M240 380 L256 365 L272 380"/>
  </g>
  <polygon points="241,343 255,339 248,353" fill="#ffffff" opacity=".55"/>
  <!-- side rubies -->
  <g stroke="#57060f" stroke-width="3" stroke-linejoin="round">
    <polygon points="168,344 186,362 168,380 150,362" fill="url(#rubyGrad)"/>
    <polygon points="344,344 362,362 344,380 326,362" fill="url(#rubyGrad)"/>
  </g>
  <g stroke="#50040d" stroke-width="2" opacity=".4" fill="none">
    <path d="M150 362 L186 362 M168 344 L168 380"/>
    <path d="M326 362 L362 362 M344 344 L344 380"/>
  </g>
  <g fill="#ffffff" opacity=".55">
    <polygon points="158,350 166,346 163,356"/>
    <polygon points="334,350 342,346 339,356"/>
  </g>
</g>

</g>
<rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldRing)" stroke-width="3" opacity=".9"/>
<rect x="2" y="2" width="508" height="508" rx="108" fill="none" stroke="#000000" stroke-width="3" opacity=".55"/>
</svg>
