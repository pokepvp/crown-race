<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agent Crown Race app icon">
<title>Agent Crown Race</title>

<defs>
  <linearGradient id="goldMark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe89a"/>
    <stop offset="1" stop-color="#c9971f"/>
  </linearGradient>
  <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7dc8f"/>
    <stop offset=".45" stop-color="#d4af37"/>
    <stop offset=".75" stop-color="#8a6a1f"/>
    <stop offset="1" stop-color="#f7dc8f"/>
  </linearGradient>
  <radialGradient id="tileGrad" cx=".5" cy=".36" r=".95">
    <stop offset="0" stop-color="#232329"/>
    <stop offset=".55" stop-color="#141419"/>
    <stop offset="1" stop-color="#0a0a0e"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="512" height="512" rx="110" fill="url(#tileGrad)"/>

<!-- bold simplified crown (same artwork as logo-mark.svg), large and centered -->
<g transform="translate(256 256) scale(1.08) translate(-256 -259)">
  <path d="M56 358 L88 178 L176 266 L256 134 L336 266 L424 178 L456 358 Z"
        fill="url(#goldMark)" stroke="#43300a" stroke-width="16" stroke-linejoin="round"/>
  <g fill="url(#goldMark)" stroke="#43300a" stroke-width="14">
    <circle cx="92" cy="146" r="36"/>
    <circle cx="256" cy="98" r="42"/>
    <circle cx="420" cy="146" r="36"/>
  </g>
  <g fill="#ffffff" opacity=".85">
    <circle cx="78" cy="132" r="9"/>
    <circle cx="240" cy="82" r="11"/>
    <circle cx="406" cy="132" r="9"/>
  </g>
  <rect x="48" y="356" width="416" height="98" rx="18"
        fill="url(#goldMark)" stroke="#43300a" stroke-width="16"/>
  <polygon points="256,348 326,405 256,462 186,405" fill="#d81f3e" stroke="#5f0815" stroke-width="9" stroke-linejoin="round"/>
  <polygon points="256,356 238,394 256,394" fill="#ffffff" opacity=".35"/>
</g>

<rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldRing)" stroke-width="3" opacity=".9"/>
<rect x="2" y="2" width="508" height="508" rx="108" fill="none" stroke="#000000" stroke-width="3" opacity=".55"/>
</svg>
